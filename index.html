<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard POES | Control de Inocuidad</title>
    
    <!-- Librerías Externas (CDNs) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Cliente de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Configuración visual de Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'corporate-green': '#1f8c22',
                        'alert-yellow': '#f59e0b',
                        'danger-red': '#dc2626',
                        'surface-dark': '#111827'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans antialiased text-gray-800">

    <!-- Encabezado / Navbar -->
    <header class="bg-white shadow-sm border-b-4 border-corporate-green sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center">
                <i class="fa-solid fa-shield-halved text-corporate-green text-3xl mr-3"></i>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold tracking-tight text-gray-800">DASHBOARD POES</h1>
                    <p class="text-[10px] md:text-xs text-gray-500 font-semibold uppercase tracking-wider">Limpieza y Desinfección</p>
                </div>
            </div>
            <div class="text-right hidden sm:block">
                <p class="text-sm font-medium text-gray-700">Planta Lácteos</p>
                <p class="text-xs text-gray-400">Datos consolidados</p>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Indicador de Carga (Spinner) -->
        <div id="loader" class="flex flex-col justify-center items-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-corporate-green mb-4"></div>
            <p class="text-gray-500 font-medium animate-pulse">Conectando con Supabase...</p>
        </div>

        <!-- Contenedor Principal (Oculto al inicio) -->
        <div id="dashboard-content" class="hidden opacity-0 transition-opacity duration-700 ease-in-out">
            
            <!-- Tarjetas de KPIs (Semáforos) -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <!-- Eficacia -->
                <div class="bg-white rounded-xl shadow-sm p-6 border-l-4 border-corporate-green transform hover:scale-105 transition-transform">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-xs font-bold text-gray-400 uppercase tracking-wide">Eficacia (% Conforme)</p>
                            <h2 class="text-3xl lg:text-4xl font-black text-gray-800 mt-2" id="kpi-eficacia">--%</h2>
                        </div>
                        <i class="fa-solid fa-check-double text-corporate-green opacity-20 text-4xl"></i>
                    </div>
                </div>

                <!-- Desvíos (Crítico) -->
                <div class="bg-white rounded-xl shadow-sm p-6 border-l-4 border-danger-red transform hover:scale-105 transition-transform">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-xs font-bold text-gray-400 uppercase tracking-wide">Desvíos (Riesgo)</p>
                            <h2 class="text-3xl lg:text-4xl font-black text-gray-800 mt-2" id="kpi-desvios">--</h2>
                        </div>
                        <i class="fa-solid fa-triangle-exclamation text-danger-red opacity-20 text-4xl"></i>
                    </div>
                </div>

                <!-- Ineficiencia (Costos) -->
                <div class="bg-white rounded-xl shadow-sm p-6 border-l-4 border-alert-yellow transform hover:scale-105 transition-transform">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-xs font-bold text-gray-400 uppercase tracking-wide">Ineficiencia (Exceso)</p>
                            <h2 class="text-3xl lg:text-4xl font-black text-gray-800 mt-2" id="kpi-excesos">--</h2>
                        </div>
                        <i class="fa-solid fa-flask text-alert-yellow opacity-20 text-4xl"></i>
                    </div>
                </div>

                <!-- Total -->
                <div class="bg-white rounded-xl shadow-sm p-6 border-l-4 border-blue-500 transform hover:scale-105 transition-transform">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-xs font-bold text-gray-400 uppercase tracking-wide">Total Muestras</p>
                            <h2 class="text-3xl lg:text-4xl font-black text-gray-800 mt-2" id="kpi-total">--</h2>
                        </div>
                        <i class="fa-solid fa-database text-blue-500 opacity-20 text-4xl"></i>
                    </div>
                </div>
            </div>

            <!-- Sección de Gráficos -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                <!-- Gráfico de Líneas (Tendencia) -->
                <div class="bg-white rounded-xl shadow-sm p-6 lg:col-span-2">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-sm font-bold text-gray-700 uppercase"><i class="fa-solid fa-chart-line mr-2 text-blue-500"></i>Tendencia: Concentración SOSA</h3>
                        <span class="text-xs text-gray-400 bg-gray-100 px-2 py-1 rounded">Últimos 30 registros</span>
                    </div>
                    <div class="relative h-72 w-full">
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>
                
                <!-- Gráfico de Dona (Distribución) -->
                <div class="bg-white rounded-xl shadow-sm p-6">
                    <h3 class="text-sm font-bold text-gray-700 uppercase mb-4"><i class="fa-solid fa-chart-pie mr-2 text-corporate-green"></i>Estado General</h3>
                    <div class="relative h-72 w-full flex justify-center items-center">
                        <canvas id="statusChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Nuestro Script Lógico (Cargado al final y sin type="module") -->
    <script src="./js/app.js"></script>
</body>
</html>
